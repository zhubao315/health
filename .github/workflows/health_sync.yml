name: Health Sync

on:
  workflow_dispatch:
  schedule:
    # 09:07 Asia/Shanghai — one pass a day. Health data is written once a day
    # by the watch, and the incremental fetch always backfills whatever a
    # missed or throttled run left behind, so an evening compensation pass only
    # doubled the Actions cost. The slot is deliberately a few minutes past the
    # hour because GitHub's scheduler heavily delays :00 slots (observed a
    # 6-hour drift on this repo).
    - cron: '7 1 * * *'   # 09:07 Asia/Shanghai
  push:
    branches:
      - main
    paths:
      - coros_health/**
      - analysis/**
      - dashboard/**
      - scripts/**
      - README.md
      - .github/workflows/health_sync.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: health-sync
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  sync:
    name: Sync health data
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # The bot's own data commit touches dashboard/, analysis/ and README.md,
      # which are all trigger paths — without this guard every sync would buy
      # itself a second full run (fetch + analysis + deploy). Pushes only run
      # the unit tests and the deploy job below.
      - name: Decide whether this run syncs
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Sync COROS health data
        if: steps.gate.outputs.run == 'true'
        env:
          COROS_ACCOUNT: ${{ secrets.COROS_ACCOUNT }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
        run: python -m coros_health.cli --incremental

      - name: Build analysis summary
        if: steps.gate.outputs.run == 'true'
        run: python analysis/health_analysis.py --days 30

      - name: Update README coverage
        if: steps.gate.outputs.run == 'true'
        run: python scripts/update_readme.py

      - name: Commit new data
        id: commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync health data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy dashboard
    needs: sync
    # Skip when the daily fetch produced nothing (the page would be identical)
    # and when the bot commits its own data — that commit's push is covered by
    # the deploy job of the run that produced it.
    if: |
      needs.sync.outputs.changed == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: sync health data'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Stamp asset fingerprints
        run: |
          # Content hash of the shipped JS/CSS. Referenced as ?v=<hash> in
          # index.html so a new deploy never pairs new HTML with a stale
          # cached app.js (and vice-versa). The same hash is stamped into the
          # __BUILD_HASH__ sentinel in both files for the runtime stale guard.
          V=$(cat dashboard/app.js dashboard/style.css | sha1sum | cut -c1-12)
          sed -i "s/__BUILD_HASH__/${V}/g" dashboard/index.html dashboard/app.js
          echo "asset build: ${V}"
          # fail the deploy if stamping did not take effect on both sides
          grep -q "window.__ASSET_BUILD__ = \"${V}\"" dashboard/index.html
          grep -q "ASSET_BUILD = '${V}'" dashboard/app.js
          grep -o 'v=[0-9a-f]*' dashboard/index.html | sort -u

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  freshness:
    # Runs after deploy so a data problem never blocks publishing the panel.
    # Distinguishes "we failed to fetch" (red) from "the source has no data"
    # (warning only — e.g. the watch was not worn).
    name: Data freshness check
    needs:
      - sync
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify the archive is current
        run: |
          python3 - <<'PY'
          import json, sys

          q = json.load(open('dashboard/data_quality.json', encoding='utf-8'))
          latest = q.get('latest_data_date')
          days = q.get('days_since_latest')
          status = q.get('sync_status')
          errors = q.get('partial_fetch_errors') or {}
          print(f'latest={latest} days_since={days} status={status}')

          if errors:
              print('::error::partial fetch failure: ' + ', '.join(sorted(errors)))
              for table, msg in errors.items():
                  print(f'::error::{table}: {msg}')
              sys.exit(1)

          if status == 'stale':
              print(f'::warning::no new source data for {days} days (device not worn?)')
          elif status == 'empty':
              print('::error::archive is empty')
              sys.exit(1)
          else:
              print('archive is current')
          PY
