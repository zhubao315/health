name: Health Sync

on:
  workflow_dispatch:
  schedule:
    # Twice a day: the morning run keeps the archive current, the evening run
    # is a compensation pass — a failed morning (COROS throttling, runner
    # hiccup) is retried the same day. Both are incremental and idempotent.
    - cron: '0 0 * * *'  # 08:00 Asia/Shanghai
    - cron: '0 12 * * *' # 20:00 Asia/Shanghai (compensation)
  push:
    branches:
      - main
    paths:
      - coros_health/**
      - analysis/**
      - dashboard/**
      - scripts/**
      - README.md
      - .github/workflows/health_sync.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: health-sync
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  sync:
    name: Sync health data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Sync COROS health data
        env:
          COROS_ACCOUNT: ${{ secrets.COROS_ACCOUNT }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
        run: python -m coros_health.cli --incremental

      - name: Build analysis summary
        run: python analysis/health_analysis.py --days 30

      - name: Update README coverage
        run: python scripts/update_readme.py

      - name: Commit new data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: sync health data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

  deploy:
    name: Deploy dashboard
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Stamp asset fingerprints
        run: |
          # Content hash of the shipped JS/CSS. Referenced as ?v=<hash> in
          # index.html so a new deploy never pairs new HTML with a stale
          # cached app.js (and vice-versa). The same hash is stamped into the
          # __BUILD_HASH__ sentinel in both files for the runtime stale guard.
          V=$(cat dashboard/app.js dashboard/style.css | sha1sum | cut -c1-12)
          sed -i "s/__BUILD_HASH__/${V}/g" dashboard/index.html dashboard/app.js
          echo "asset build: ${V}"
          # fail the deploy if stamping did not take effect on both sides
          grep -q "window.__ASSET_BUILD__ = \"${V}\"" dashboard/index.html
          grep -q "ASSET_BUILD = '${V}'" dashboard/app.js
          grep -o 'v=[0-9a-f]*' dashboard/index.html | sort -u

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  freshness:
    # Runs after deploy so a data problem never blocks publishing the panel.
    # Distinguishes "we failed to fetch" (red) from "the source has no data"
    # (warning only — e.g. the watch was not worn).
    name: Data freshness check
    needs:
      - sync
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify the archive is current
        run: |
          python3 - <<'PY'
          import json, sys

          q = json.load(open('dashboard/data_quality.json', encoding='utf-8'))
          latest = q.get('latest_data_date')
          days = q.get('days_since_latest')
          status = q.get('sync_status')
          errors = q.get('partial_fetch_errors') or {}
          print(f'latest={latest} days_since={days} status={status}')

          if errors:
              print('::error::partial fetch failure: ' + ', '.join(sorted(errors)))
              for table, msg in errors.items():
                  print(f'::error::{table}: {msg}')
              sys.exit(1)

          if status == 'stale':
              print(f'::warning::no new source data for {days} days (device not worn?)')
          elif status == 'empty':
              print('::error::archive is empty')
              sys.exit(1)
          else:
              print('archive is current')
          PY
