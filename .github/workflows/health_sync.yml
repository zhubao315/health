name: Health Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 08:00 Asia/Shanghai
  push:
    branches:
      - main
    paths:
      - coros_health/**
      - analysis/**
      - dashboard/**
      - scripts/**
      - README.md
      - .github/workflows/health_sync.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: health-sync
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  sync:
    name: Sync health data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Sync COROS health data
        env:
          COROS_ACCOUNT: ${{ secrets.COROS_ACCOUNT }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
        run: python -m coros_health.cli --incremental

      - name: Build analysis summary
        run: python analysis/health_analysis.py --days 30

      - name: Update README coverage
        run: python scripts/update_readme.py

      - name: Commit new data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: sync health data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

  deploy:
    name: Deploy dashboard
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Stamp asset fingerprints
        run: |
          # Content hash of the shipped JS/CSS. Referenced as ?v=<hash> in
          # index.html so a new deploy never pairs new HTML with a stale
          # cached app.js (and vice-versa). Also stamps the __BUILD__ sentinel
          # in both files for the runtime stale-pair guard.
          V=$(cat dashboard/app.js dashboard/style.css | sha1sum | cut -c1-12)
          sed -i "s/__BUILD__/${V}/g" dashboard/index.html dashboard/app.js
          echo "asset build: ${V}"
          grep -o 'v=[0-9a-f]*' dashboard/index.html | sort -u

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
