    <circle cx="5.2" cy="16.4" r="3.6"/>
    <circle cx="18.8" cy="16.4" r="3.6"/>
    <path d="M5.2 16.4h6.6L9 10.4H5.2"/>
    <path d="M9 10.4h6.6l3.2 6h-6.6"/>
    <path d="M15.6 10.4 17 8.2h2.4"/>
    <path d="M7.8 10.4h2.6"/>
  </g>
  <circle cx="11.8" cy="16.4" r="1.4" fill="#F59E0B" stroke="none"/>
</svg>
