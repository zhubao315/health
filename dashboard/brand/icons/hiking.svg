<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" role="img" aria-label="HIKING">
  <title>HIKING — Mountain Exploration</title>
  <!-- Neo Sport Glyph: layered peaks + ascending trail reaching a summit node.
       One contour line gives depth; peaks/trail/contour read as one shape. -->
  <g stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- twin peaks: lower ridge + main summit -->
    <path d="M2.6 18.6 8.2 8.4l3.4 6 2.4-4 4.2 8.2"/>
    <!-- baseline -->
    <path d="M2.4 18.8h19"/>
    <!-- simplified contour -->
    <path d="M6.4 13.4c1.8-1.1 3.4-1.1 5 0" opacity="0.6"/>
  </g>
  <!-- ascending trail to the summit, with a summit node -->
  <path d="M10.4 15.6c1.2-1.4 1.2-3 2.8-4.2" stroke="#10B981" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="13.4" cy="11.2" r="1.3" fill="#10B981" stroke="#34D399" stroke-width="0.7"/>
</svg>
