<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 116" fill="none" role="img" aria-label="ACTIVE">
  <title>ACTIVE symbol — PRECISION MOTION</title>
  <!--
    Hand-rebuilt from the identity board with Bézier paths + native gradients.
    Coordinates are board pixels offset by (-80,-50); viewBox matches the mark.
    Three shapes, no bitmap: rising stroke, falling stroke, bottom motion arc.
    The triangular gap between them is genuine transparent negative space.
  -->
  <defs>
    <linearGradient id="rise" x1="10" y1="112" x2="100" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="fall" x1="92" y1="14" x2="140" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="arc" x1="60" y1="100" x2="168" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.6" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- 1. rising stroke: wide ribbon bottom-left -> apex -->
  <path d="M2 110
           L30 110
           C40 96 52 74 66 52
           L94 8
           C88 5 80 5 74 8
           L36 64
           C24 86 12 104 2 110 Z" fill="url(#rise)"/>

  <!-- 2. falling stroke: darker blue, apex -> lower right, ends in a blunt tip -->
  <path d="M92 8
           C104 11 113 22 120 36
           L147 70
           C141 73 131 71 124 64
           L96 26 Z" fill="url(#fall)"/>

  <!-- 3. bottom motion arc: crescent that thickens into a down-angled wedge on the right -->
  <path d="M58 98
           C70 82 82 71 98 69
           C120 66 146 70 166 84
           C170 92 172 101 174 110
           C164 108 156 103 150 96
           C138 86 118 82 100 85
           C82 88 68 93 62 101 Z" fill="url(#arc)"/>
</svg>
