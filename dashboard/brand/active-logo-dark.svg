<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="ACTIVE">
  <title>ACTIVE</title>
  <!-- The trail: a single Z-shaped stroke. One continuous line that starts
       high, crosses the frame and lands low — the shape of a route. -->
  <path d="M7 9h18L7 23h18" stroke="#0b1d33" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round" />
  <!-- The node: the point on the trail where you are right now. -->
  <circle cx="16" cy="16" r="2.4" fill="#d9a40a" />
</svg>
