<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="ACTIVE WATCH — operations control center">
  <title>ACTIVE WATCH — OPERATIONS CONTROL CENTER</title>
  <!--
    Four nodes = the four ACTIVE sites; the centre = the control centre.
    Connectors are deliberately sparse: a monitoring diagram, not a network
    topology. Green is used only for healthy status.
  -->
  <path d="M32 9 51 32 32 55 13 32 32 9Z" stroke="#94A3B8" stroke-width="1.6" opacity="0.75" />
  <g fill="#0B1D33" stroke="#F7FAFF" stroke-width="2.4">
    <circle cx="32" cy="9" r="5.5" />
    <circle cx="51" cy="32" r="5.5" />
    <circle cx="32" cy="55" r="5.5" />
    <circle cx="13" cy="32" r="5.5" />
  </g>
  <g fill="#34D399">
    <circle cx="32" cy="9" r="2.4" />
    <circle cx="51" cy="32" r="2.4" />
    <circle cx="32" cy="55" r="2.4" />
    <circle cx="13" cy="32" r="2.4" />
  </g>
  <path d="M32 23 24.6 43h4.2L32 32.5l3.2 10.5h4.2L32 23Z" fill="#38BDF8" />
</svg>
